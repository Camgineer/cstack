name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, host manifests, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bun and run checks
        env:
          SETUP_TOOL_ROOT: ${{ runner.temp }}/plugin-tools
          SETUP_BUN_CACHE: ${{ runner.temp }}/bun-cache
        run: bash tools/setup.sh
