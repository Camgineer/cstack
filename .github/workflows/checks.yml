name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Typecheck, host manifests, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Bun and run checks
        env:
          SETUP_TOOL_ROOT: ${{ runner.temp }}/plugin-tools
          SETUP_BUN_CACHE: ${{ runner.temp }}/bun-cache
        run: bash tools/setup.sh
      - name: Check that the PR title names a release level and leaves the version alone
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: '"${{ runner.temp }}/plugin-tools/bin/bun" tools/version.ts check --base HEAD^1 --title "$TITLE"'
